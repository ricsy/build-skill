[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "build-skill"
version = "1.0.2"
description = "Package skills into distributable tarballs"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "typer==0.12.5",
  "click>=8.0,<8.2",
  "pyyaml==6.0.2",
  "loguru==0.7.3",
]

[project.optional-dependencies]
dev = [
  "pydantic>=2.0",
  "pytest>=8.0",
  "pytest-cov>=4.0",
  "ruff>=0.1",
  "mypy>=1.0",
  "build>=1.4.0",
]

[project.scripts]
build-skill = "build_skill.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["build_skill"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false